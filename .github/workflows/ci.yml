name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Only superseded PR runs are cancelled. Release callers and branch pushes keep
# their complete evidence even when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select validation lanes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      python: ${{ steps.select.outputs.python }}
      features: ${{ steps.select.outputs.features }}
      wasm: ${{ steps.select.outputs.wasm }}
      qualification: ${{ steps.select.outputs.qualification }}
      web: ${{ steps.select.outputs.web }}
      consumers: ${{ steps.select.outputs.consumers }}
      audit: ${{ steps.select.outputs.audit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select checks from the complete PR diff
        id: select
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py --event-name "$CI_EVENT_NAME"

  release-integrity:
    name: Release Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check release metadata integrity
        run: python3 scripts/check_release_integrity.py

      - name: Check active documentation links
        run: python3 scripts/check_docs.py

      - name: Test CI routing and independent validation tools
        run: python3 -m unittest discover -s tests -p 'test_*py'

  fmt:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies for rug (GMP/MPFR)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Run clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run clippy (no default features)
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

      - name: Run clippy (highprec feature)
        run: cargo clippy --all-targets --features highprec --locked -- -D warnings

  check-features:
    needs: scope
    if: needs.scope.outputs.features == 'true'
    name: Feature coverage check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check Python bindings crate
        run: cargo check --manifest-path ries-py/Cargo.toml --locked

      - name: Build wasm feature
        run: cargo build --features wasm --locked

  test-ries-py-rust:
    needs: scope
    if: needs.scope.outputs.python == 'true'
    name: Test (ries-py Rust helpers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check Python binding Rust formatting
        run: cargo fmt --manifest-path ries-py/Cargo.toml -- --check

      - name: Run ries-py Rust-side tests
        run: ./scripts/test_ries_py_rust.sh

  test-ries-py-python:
    needs: scope
    if: needs.scope.outputs.python == 'true'
    name: Test (ries-py Python integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run ries-py Python integration tests
        run: ./scripts/test_ries_py_python.sh -q

      - name: Check CAS export semantics with SymPy
        run: |
          cargo build --bin ries-rs --locked
          uv run --no-project --with sympy==1.14.0 python scripts/check_cas_exports.py --binary target/debug/ries-rs

  test:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo nextest run --tests --locked

      - name: Run Rust documentation examples once
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --locked

  test-highprec:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Test (highprec feature)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies for rug (GMP/MPFR)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Run tests with highprec feature
        run: cargo nextest run --tests --features highprec --locked

  test-wasm:
    needs: scope
    if: needs.scope.outputs.wasm == 'true'
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run WASM tests
        run: wasm-pack test --node -- --features wasm

  audit:
    needs: scope
    if: needs.scope.outputs.audit == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit

  parity-check:
    needs: scope
    if: needs.scope.outputs.qualification == 'true'
    name: Historical root-accuracy smoke (Original RIES)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ries-rs
        uses: actions/checkout@v5

      - name: Download and verify original RIES source
        run: |
          curl --fail --location --retry 3 https://www.mrob.com/pub/ries/src/ries.c.txt -o /tmp/ries-original.c
          echo "df335f024d5ebd18134386edb7ca29ab25981c8b2e44be55b7a811d80bb57621  /tmp/ries-original.c" | sha256sum --check

      - name: Compile original RIES
        run: gcc -O2 /tmp/ries-original.c -lm -o /tmp/ries-original

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build ries-rs
        run: cargo build --release --locked

      - name: Check decimal parsing against an independent Fraction oracle
        run: python3 scripts/check_decimal_boundary.py --binary target/release/ries-rs --output qualification/decimal-boundary.json

      - name: Qualify matcher corpus and retain independent evidence
        run: python3 scripts/qualify_search.py --output qualification/matchers

      - name: Check precision-aware discovery quality and evidence exports
        run: python3 scripts/qualify_discovery.py --binary target/release/ries-rs --output qualification/discovery

      - name: Compare historical equation identities and independently bound roots
        run: python3 scripts/compare_original.py --original /tmp/ries-original --output qualification/historical

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: search-qualification-${{ github.sha }}
          path: qualification/
          retention-days: 90

      - name: Run historical accuracy smoke checks
        run: |
          ./tests/compare_with_original.sh 2 2 6 /tmp/ries-original
          ./tests/compare_with_original.sh 3.1415926535 2 6 /tmp/ries-original
          ./tests/compare_with_original.sh 2.7182818284 2 6 /tmp/ries-original
          ./tests/compare_with_original.sh 1.6180339887 2 6 /tmp/ries-original

  test-web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    name: Test (built browser UI)
    # Playwright 1.58.2 supports this image; ubuntu-latest can advance first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: taiki-e/install-action@wasm-pack
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:smoke:build
      - name: Check committed CSS is current
        run: git diff --exit-code -- web/styles.css
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/

  test-installed-consumers:
    needs: scope
    if: needs.scope.outputs.consumers == 'true'
    name: Test (installed release consumers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: taiki-e/install-action@wasm-pack
      - run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test packaged and installed consumers at this commit
        run: python3 scripts/test_release_consumers.py --output "$RUNNER_TEMP/ries-consumers"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installed-consumers-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ries-consumers/*.stdout
            ${{ runner.temp }}/ries-consumers/*.stderr
            ${{ runner.temp }}/ries-consumers/*.json
            ${{ runner.temp }}/ries-consumers/*.crate
            ${{ runner.temp }}/ries-consumers/*.tgz
            ${{ runner.temp }}/ries-consumers/cli/bin/*
            ${{ runner.temp }}/ries-consumers/wheels/*
          retention-days: 90

  ci-result:
    name: CI result
    if: always()
    needs:
      - scope
      - release-integrity
      - fmt
      - clippy
      - check-features
      - test-ries-py-rust
      - test-ries-py-python
      - test
      - test-highprec
      - test-wasm
      - audit
      - parity-check
      - test-web
      - test-installed-consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py --check-results
