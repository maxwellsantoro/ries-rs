name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  release-integrity:
    name: Release Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check release metadata integrity
        run: python3 scripts/check_release_integrity.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies for rug (GMP/MPFR)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Run clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run clippy (no default features)
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

      - name: Run clippy (highprec feature)
        run: cargo clippy --all-targets --features highprec --locked -- -D warnings

  check-features:
    name: Feature coverage check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check Python bindings crate
        run: cargo check --manifest-path ries-py/Cargo.toml --locked

      - name: Build wasm feature
        run: cargo build --features wasm --locked

      - name: Build wasm + parallel features
        run: cargo build --features "wasm parallel" --locked

  test-ries-py-rust:
    name: Test (ries-py Rust helpers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run ries-py Rust-side tests
        run: ./scripts/test_ries_py_rust.sh

  test-ries-py-python:
    name: Test (ries-py Python integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run ries-py Python integration tests
        run: ./scripts/test_ries_py_python.sh -q

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo nextest run --tests --locked

  test-highprec:
    name: Test (highprec feature)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies for rug (GMP/MPFR)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Run tests with highprec feature
        run: cargo nextest run --tests --features highprec --locked

  test-wasm:
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run WASM tests
        run: wasm-pack test --node -- --features wasm

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit

  parity-check:
    name: Parity Check (Original RIES)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ries-rs
        uses: actions/checkout@v5

      - name: Test parity and benchmark validation
        run: python3 tests/test_ci_validation.py

      - name: Download and verify original RIES source
        run: |
          curl --fail --location --retry 3 https://www.mrob.com/pub/ries/src/ries.c.txt -o /tmp/ries-original.c
          echo "df335f024d5ebd18134386edb7ca29ab25981c8b2e44be55b7a811d80bb57621  /tmp/ries-original.c" | sha256sum --check

      - name: Compile original RIES
        run: gcc -O2 /tmp/ries-original.c -lm -o /tmp/ries-original

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build ries-rs
        run: cargo build --release --locked

      - name: Run parity checks
        run: |
          ./tests/compare_with_original.sh 2 2 6 /tmp/ries-original
          ./tests/compare_with_original.sh 3.1415926535 2 6 /tmp/ries-original
          ./tests/compare_with_original.sh 2.7182818284 2 6 /tmp/ries-original
          ./tests/compare_with_original.sh 1.6180339887 2 6 /tmp/ries-original
