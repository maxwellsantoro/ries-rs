name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: coverage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select coverage scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reuse the CI change classifier
        id: select
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py --event-name "$CI_EVENT_NAME"

  coverage:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      # Ptrace single-steps Expression::drop and dies with SIGSEGV there.
      # The same binary exits 0, including under valgrind. LLVM coverage
      # instruments the binary at compile time, so the spawned ries-rs is
      # still counted and --follow-exec does not have to ptrace it.
      - name: Generate coverage
        run: >-
          cargo tarpaulin --locked --engine Llvm --out Xml --output-dir ./coverage
          --timeout 1200 --follow-exec --fail-under 50

      - name: Report coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Coverage report generated and uploaded as artifact." >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ./coverage/cobertura.xml
          retention-days: 30

  coverage-result:
    name: Coverage result
    if: always()
    needs: [scope, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require selected coverage to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py --check-coverage-results
